<!-- plugins/veroscholar/templates/review.html -->
<!DOCTYPE html>
<html lang="{{ g.lang_code or 'zh-CN' }}">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{{ _('Review Generator') }} - VeroRun</title>
<link rel="stylesheet" href="/static/css/design-system.css"/>
<link rel="stylesheet" href="/static/css/themes.css"/>
<link rel="stylesheet" href="/admin/veroscholar/static/css/veroscholar.css"/>
<script>
(function(){
  var KEY='verorun_admin_theme';
  function apply(){
    try{
      var t=localStorage.getItem(KEY);
      if(t==='slate'||t==='light'){document.documentElement.setAttribute('data-theme',t);}
      else if(document.documentElement.hasAttribute('data-theme')){document.documentElement.removeAttribute('data-theme');}
    }catch(e){}
  }
  apply();
  window.addEventListener('storage',function(e){if(e.key===KEY||e.key===null)apply();});
  setInterval(apply,1000);
})();
</script>
<script>
window.__t = {{ translations|tojson }};
window.__locale = '{{ g.lang_code or "zh-CN" }}';
</script>
</head>
<body>
<div class="vs-page">
  <h2>{{ _('Review Generator') }}</h2>
  <div class="vs-sub">{{ _('Generate a structured literature review via the DAG workflow') }}</div>

  <!-- 触发区 -->
  <div class="vs-panel">
    <div class="vs-field">
      <label>{{ _('Review Topic') }} *</label>
      <input type="text" id="rv-topic" placeholder="{{ _('e.g. Efficient Attention for Vision Transformers') }}"/>
    </div>
    <div class="vs-field">
      <label>{{ _('Keywords (optional, ";" separated)') }}</label>
      <input type="text" id="rv-keywords" placeholder="{{ _('optional: transformer; attention; efficiency') }}"/>
    </div>
    <button class="btn btn-primary" id="rv-run">{{ _('Generate Review') }}</button>
  </div>

  <!-- 工作流进度 -->
  <div class="vs-panel" id="rv-progress" style="display:none;">
    <h3 style="margin-top:0;">{{ _('Workflow Progress') }}</h3>
    <div class="vs-progress" id="rv-steps"></div>
    <div style="margin-top:10px;font-size:13px;color:var(--text-secondary);" id="rv-status"></div>
  </div>

  <div class="vs-grid-2">
    <!-- 综述列表 -->
    <div class="vs-section">
      <h3>{{ _('My Reviews') }}</h3>
      <div id="rv-list"></div>
    </div>

    <!-- 综述详情 -->
    <div class="vs-section">
      <h3>{{ _('Review Detail') }}</h3>
      <div class="vs-panel" id="rv-detail">
        <div class="vs-empty">{{ _('select_review_hint') }}</div>
      </div>
    </div>
  </div>
</div>

<script src="/admin/veroscholar/static/js/veroscholar.js"></script>
<script>
(function () {
  var VS = window.VS;
  var pollTimer = null;

  var STEP_LABELS = [
    'n1', 'n2', 'n3', 'n4', 'n5', 'n6'
  ];

  function runWorkflow() {
    var topic = document.getElementById('rv-topic').value.trim();
    if (!topic) { VS.toast(VS.t('topic_required'), 'error'); return; }
    var body = { topic: topic, keywords: document.getElementById('rv-keywords').value.trim() };
    document.getElementById('rv-run').disabled = true;
    VS.api('/admin/veroscholar/api/v1/workflow/run', { method: 'POST', body: JSON.stringify(body) })
      .then(function (r) {
        document.getElementById('rv-run').disabled = false;
        if (r.success) {
          VS.toast(VS.t('workflow_started'), 'success');
          document.getElementById('rv-progress').style.display = '';
          pollStatus(r.instance_id);
        } else {
          VS.toast(r.error || VS.t('failed'), 'error');
        }
      })
      .catch(function () {
        document.getElementById('rv-run').disabled = false;
        VS.toast(VS.t('network_error'), 'error');
      });
  }

  function pollStatus(instanceId) {
    if (pollTimer) { clearInterval(pollTimer); }
    var check = function () {
      VS.api('/admin/veroscholar/api/v1/workflow/instances/' + instanceId).then(function (r) {
        if (!r || !r.success) { return; }
        renderSteps(r.nodes || []);
        var inst = r.instance || {};
        document.getElementById('rv-status').textContent = VS.t('status') + ': ' + (inst.status || 'running');
        if (inst.status === 'completed' || inst.status === 'failed' || inst.status === 'cancelled') {
          clearInterval(pollTimer);
          pollTimer = null;
          loadReviews();
        }
      }).catch(function () {});
    };
    check();
    pollTimer = setInterval(check, 5000);
  }

  function renderSteps(nodes) {
    var box = document.getElementById('rv-steps');
    var html = nodes.map(function (n) {
      var cls = 'vs-step';
      var dot = '';
      if (n.status === 'completed') { cls += ' done'; dot = '&#10003;'; }
      else if (n.status === 'running') { cls += ' running'; dot = '&#9679;'; }
      else if (n.status === 'failed') { cls += ' failed'; dot = '&#10007;'; }
      return '<div class="' + cls + '"><span class="vs-step-dot">' + dot + '</span>' +
        '<span>' + VS.esc(n.name || n.node_type || n.node_id || '') + '</span></div>';
    }).join('');
    box.innerHTML = html || '<div class="vs-empty">' + VS.t('no_steps') + '</div>';
  }

  function loadReviews() {
    VS.api('/admin/veroscholar/api/v1/reviews').then(function (r) {
      if (!r || !r.success) { return; }
      var box = document.getElementById('rv-list');
      if (!r.data.length) { box.innerHTML = '<div class="vs-empty">' + VS.t('no_reviews') + '</div>'; return; }
      box.innerHTML = r.data.map(function (rev) {
        return '<div class="vs-paper">' +
          '<div class="vs-paper-head"><span class="vs-badge">' + VS.esc(rev.status || 'draft') + '</span>' +
          '<span class="vs-paper-year">' + VS.esc(String(rev.created_at || '').slice(0, 10)) + '</span></div>' +
          '<div class="vs-paper-title" style="cursor:pointer;" data-rid="' + VS.esc(rev.id) + '">' + VS.esc(rev.title) + '</div>' +
          (rev.topic ? '<div class="vs-paper-abs">' + VS.esc(rev.topic) + '</div>' : '') +
          '</div>';
      }).join('');
      box.querySelectorAll('[data-rid]').forEach(function (el) {
        el.addEventListener('click', function () { openReview(el.getAttribute('data-rid')); });
      });
    }).catch(function () {});
  }

  function openReview(id) {
    VS.api('/admin/veroscholar/api/v1/reviews/' + encodeURIComponent(id)).then(function (r) {
      if (!r || !r.success) { return; }
      var rev = r.data;
      var box = document.getElementById('rv-detail');
      var content = rev.content
        ? '<div style="white-space:pre-wrap;font-size:13px;line-height:1.7;">' + VS.esc(rev.content) + '</div>'
        : '<div class="vs-empty">' + VS.t('content_not_ready') + '</div>';
      box.innerHTML = '<h3 style="margin-top:0;">' + VS.esc(rev.title) + '</h3>' +
        '<div class="vs-sub">' + VS.esc(rev.topic || '') + '</div>' +
        '<div style="margin:10px 0;" class="vs-note-type">' + VS.esc(rev.status || 'draft') + '</div>' +
        '<div id="rv-verify" style="display:none;margin:10px 0;" class="vs-note-type"></div>' +
        content;
      verifyReview(id);
    }).catch(function () {});
  }

  /** 校验综述引用真实性：权威注册机构在线验真 + 本地库补充，按五态着色展示。 */
  function verifyReview(id) {
    var box = document.getElementById('rv-verify');
    if (!box) { return; }
    VS.api('/admin/veroscholar/api/v1/reviews/' + encodeURIComponent(id) + '/verify').then(function (r) {
      if (!r || !r.success) { return; }
      var d = r.data;
      var refs = d.references || [];
      if (!d.total_references && !d.missing_paper_ids.length) { return; }
      box.style.display = '';
      var html = '<div class="vs-note-type" style="margin-bottom:8px;font-weight:600;">' +
        VS.t('ref_check_title') + '</div>';
      // 引用列表
      if (refs.length) {
        html += '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:6px;">' +
          VS.t('ref_check_total').replace('%d', refs.length) + '</div>';
        html += '<div style="font-size:12px;line-height:1.8;">';
        refs.forEach(function (ref) {
          var status = ref.registry_status || 'offline';
          var color, label;
          switch (status) {
            case 'registered':  color = '#27ae60'; label = VS.t('ref_check_registered'); break;
            case 'retracted':   color = '#c0392b'; label = VS.t('ref_check_retracted'); break;
            case 'concern':     color = '#f39c12'; label = VS.t('ref_check_concern'); break;
            case 'unregistered': color = '#c0392b'; label = VS.t('ref_check_unregistered'); break;
            default:            color = '#95a5a6'; label = VS.t('ref_check_offline');
          }
          html += '<div style="margin:4px 0;padding:4px 6px;border-left:3px solid ' + color + ';background:var(--bg-secondary, #f8f9fa);border-radius:3px;">';
          html += '<span style="color:' + color + ';font-weight:600;">' + label + '</span>';
          html += ' <code style="font-size:11px;">' + VS.esc(ref.doi) + '</code>';
          if (status === 'retracted' && ref.notice_doi) {
            html += ' <a href="https://doi.org/' + encodeURIComponent(ref.notice_doi) + '" target="_blank" style="color:#c0392b;text-decoration:underline;">' + VS.t('ref_check_notice_link') + '</a>';
          }
          html += ' <span style="color:var(--text-secondary);font-size:11px;">' +
            (ref.in_library ? VS.t('ref_check_in_library') : VS.t('ref_check_not_in_library')) + '</span>';
          html += '</div>';
        });
        html += '</div>';
      }
      // 库内论文缺失
      if (d.missing_paper_ids && d.missing_paper_ids.length) {
        html += '<div style="margin-top:8px;font-size:12px;color:#c0392b;">' +
          VS.t('missing_paper_ids') + ': ' + d.missing_paper_ids.join(', ') + '</div>';
      }
      box.innerHTML = html;
    }).catch(function () {});
  }

  function init() {
    document.getElementById('rv-run').addEventListener('click', runWorkflow);
    document.getElementById('rv-topic').addEventListener('keydown', function (e) { if (e.key === 'Enter') { runWorkflow(); } });
    loadReviews();
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
