<!-- plugins/veroscholar/templates/search.html -->
<!DOCTYPE html>
<html lang="{{ g.lang_code or 'zh-CN' }}">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{{ _('Literature Search') }} - VeroRun</title>
<link rel="stylesheet" href="/static/css/design-system.css"/>
<link rel="stylesheet" href="/static/css/themes.css"/>
<link rel="stylesheet" href="/admin/veroscholar/static/css/veroscholar.css"/>
<script>
(function(){
  var KEY='verorun_admin_theme';
  function apply(){
    try{
      var t=localStorage.getItem(KEY);
      if(t==='slate'||t==='light'){document.documentElement.setAttribute('data-theme',t);}
      else if(document.documentElement.hasAttribute('data-theme')){document.documentElement.removeAttribute('data-theme');}
    }catch(e){}
  }
  apply();
  window.addEventListener('storage',function(e){if(e.key===KEY||e.key===null)apply();});
  setInterval(apply,1000);
})();
</script>
<script>
window.__t = {{ translations|tojson }};
window.__locale = '{{ g.lang_code or "zh-CN" }}';
</script>
</head>
<body>
<div class="vs-page">
  <h2>{{ _('Literature Search') }}</h2>
  <div class="vs-sub">{{ _('Multi-source search across arXiv, Semantic Scholar, OpenAlex and Chinese works') }}</div>

  <!-- 检索区 -->
  <div class="vs-panel">
    <div class="vs-search-row">
      <input type="text" id="q" placeholder="{{ _('Enter keywords, e.g. transformer attention') }}"/>
      <button class="btn btn-primary" id="btn-search">{{ _('Search') }}</button>
    </div>
    <div class="vs-checks">
      <label><input type="checkbox" id="src-arxiv" checked/> arXiv</label>
      <label><input type="checkbox" id="src-semantic" checked/> Semantic Scholar</label>
      <label><input type="checkbox" id="src-openalex" checked/> OpenAlex</label>
      <label><input type="checkbox" id="src-openalex-zh" checked/> {{ _('OpenAlex (Chinese)') }}</label>
      <label>{{ _('Limit') }} <input type="number" id="limit" value="30" min="5" max="100" style="width:70px;"/></label>
    </div>
  </div>

  <!-- 检索结果 -->
  <div class="vs-section">
    <h3 id="results-title">{{ _('Search Results') }}</h3>
    <div id="results"></div>
  </div>

  <!-- 论文库（已保存） -->
  <div class="vs-section">
    <h3>{{ _('Paper Library') }}</h3>
    <div class="vs-search-row">
      <input type="text" id="lib-q" placeholder="{{ _('Filter library...') }}"/>
      <select id="lib-source">
        <option value="">{{ _('All Sources') }}</option>
        <option value="arxiv">arXiv</option>
        <option value="semantic_scholar">Semantic Scholar</option>
        <option value="openalex">OpenAlex</option>
        <option value="openalex_zh">{{ _('OpenAlex (Chinese)') }}</option>
      </select>
      <select id="lib-tag">
        <option value="">{{ _('All Tags') }}</option>
      </select>
      <select id="lib-status">
        <option value="">{{ _('All Status') }}</option>
        <option value="unread">{{ _('Unread') }}</option>
        <option value="reading">{{ _('Reading') }}</option>
        <option value="read">{{ _('Read') }}</option>
      </select>
      <button class="btn btn-secondary btn-sm" id="lib-refresh">{{ _('Refresh') }}</button>
    </div>
    <div id="library"></div>
  </div>
</div>

<!-- 论文详情抽屉 -->
<div class="vs-drawer" id="drawer">
  <div class="vs-drawer-inner">
    <button class="vs-drawer-close" id="drawer-close">&times;</button>
    <h3 id="d-title" style="margin-top:0;">--</h3>
    <div class="vs-paper-meta" id="d-meta"></div>
    <div class="vs-paper-venue" id="d-venue"></div>
    <div style="margin:12px 0;">
      <a class="btn btn-secondary btn-sm" id="d-pdf" target="_blank" rel="noopener" href="#" style="display:none;">PDF</a>
      <button class="btn btn-secondary btn-sm" data-export="bib">BibTeX</button>
      <button class="btn btn-secondary btn-sm" data-export="ris">RIS</button>
      <button class="btn btn-secondary btn-sm" id="d-annotate">{{ _('Add Note') }}</button>
      <select id="d-project" style="padding:8px;margin-left:8px;border-radius:8px;border:1px solid var(--border-color);">
        <option value="">{{ _('Add to project...') }}</option>
      </select>
      <select id="d-status" style="padding:8px;margin-left:8px;border-radius:8px;border:1px solid var(--border-color);">
        <option value="unread">{{ _('Unread') }}</option>
        <option value="reading">{{ _('Reading') }}</option>
        <option value="read">{{ _('Read') }}</option>
      </select>
    </div>

    <div class="vs-section">
      <h3>{{ _('Abstract') }}</h3>
      <div style="font-size:13px;color:var(--text-secondary);white-space:pre-wrap;" id="d-abstract"></div>
    </div>

    <div class="vs-section">
      <h3>{{ _('AI Assistant') }}</h3>
      <div style="display:flex;gap:8px;margin-bottom:8px;">
        <input type="text" id="d-ai-q" placeholder="{{ _('Ask this paper...') }}" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--border-color);"/>
        <button class="btn btn-primary btn-sm" id="d-ai-ask">{{ _('Ask') }}</button>
        <button class="btn btn-secondary btn-sm" id="d-ai-translate">{{ _('Translate abstract') }}</button>
      </div>
      <div id="d-ai-result" style="display:none;font-size:13px;line-height:1.7;white-space:pre-wrap;background:var(--bg-2,#fafafa);border-radius:8px;padding:10px;margin-bottom:8px;"></div>
      <div id="d-related"></div>
    </div>

    <div class="vs-section">
      <h3>{{ _('Full text') }}</h3>
      <div style="display:flex;gap:8px;margin-bottom:8px;">
        <input type="file" id="d-ft-file" accept="application/pdf" style="flex:1;"/>
        <button class="btn btn-primary btn-sm" id="d-ft-upload">{{ _('Upload PDF') }}</button>
      </div>
      <div id="d-ft-files"></div>
      <div id="d-ft-chunks"></div>
    </div>

    <div class="vs-section">
      <h3>{{ _('Tags') }}</h3>
      <div style="display:flex;gap:8px;margin-bottom:8px;">
        <input type="text" id="d-tag-input" placeholder="{{ _('Add tag...') }}" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--border-color);"/>
        <button class="btn btn-secondary btn-sm" id="d-tag-add">{{ _('Add') }}</button>
      </div>
      <div id="d-tags"></div>
    </div>

    <div class="vs-section">
      <h3>{{ _('Notes') }}</h3>
      <div class="vs-field">
        <select id="d-note-type">
          <option value="summary">{{ _('Summary') }}</option>
          <option value="critique">{{ _('Critique') }}</option>
          <option value="methodology">{{ _('Methodology') }}</option>
          <option value="question">{{ _('Question') }}</option>
        </select>
        <textarea id="d-note-content" placeholder="{{ _('Write a note...') }}"></textarea>
      </div>
      <div id="d-notes"></div>
    </div>
  </div>
</div>

<script src="/admin/veroscholar/static/js/veroscholar.js"></script>
<script>
(function () {
  var VS = window.VS;
  var currentPaperId = null;

  function srcEnabled() {
    var list = [];
    if (document.getElementById('src-arxiv').checked) { list.push('arxiv'); }
    if (document.getElementById('src-semantic').checked) { list.push('semantic'); }
    if (document.getElementById('src-openalex').checked) { list.push('openalex'); }
    if (document.getElementById('src-openalex-zh').checked) { list.push('openalex_zh'); }
    return list;
  }

  function doSearch() {
    var q = document.getElementById('q').value.trim();
    if (!q) { VS.toast(VS.t('enter_keywords'), 'error'); return; }
    var limit = parseInt(document.getElementById('limit').value, 10) || 30;
    var body = { keywords: q, limit: limit, sources: srcEnabled() };
    var box = document.getElementById('results');
    box.innerHTML = '<div class="vs-empty">' + VS.t('searching') + '</div>';
    VS.api('/admin/veroscholar/api/v1/search', { method: 'POST', body: JSON.stringify(body) })
      .then(function (r) {
        if (!r || !r.success) { box.innerHTML = '<div class="vs-empty">' + VS.esc(r && r.error || VS.t('failed')) + '</div>'; return; }
        document.getElementById('results-title').textContent = VS.t('search_results') + ' (' + r.count + ')';
        if (r.errors && Object.keys(r.errors).length) {
          VS.toast(VS.t('partial_source_error'), 'error');
        }
        VS.renderPapers(box, r.data, {
          onDetail: function (id) { openDetail(id); },
          onAddToProject: function () { VS.toast(VS.t('add_hint')); }
        });
        loadLibrary();
      })
      .catch(function () { box.innerHTML = '<div class="vs-empty">' + VS.t('network_error') + '</div>'; });
  }

  function loadLibrary() {
    var q = document.getElementById('lib-q').value.trim();
    var src = document.getElementById('lib-source').value;
    var tag = document.getElementById('lib-tag').value;
    var status = document.getElementById('lib-status').value;
    var url = '/admin/veroscholar/api/v1/papers?limit=20';
    if (q) { url += '&q=' + encodeURIComponent(q); }
    if (src) { url += '&source_db=' + encodeURIComponent(src); }
    if (tag) { url += '&tag=' + encodeURIComponent(tag); }
    if (status) { url += '&status=' + encodeURIComponent(status); }
    VS.api(url).then(function (r) {
      if (r && r.success) {
        VS.renderPapers(document.getElementById('library'), r.data, {
          onDetail: function (id) { openDetail(id); }
        });
      }
    }).catch(function () {});
  }

  function loadTagFilter() {
    VS.api('/admin/veroscholar/api/v1/tags').then(function (r) {
      if (!r || !r.success) { return; }
      var sel = document.getElementById('lib-tag');
      var html = '<option value="">' + VS.t('all_tags') + '</option>';
      r.data.forEach(function (t) {
        html += '<option value="' + VS.esc(String(t.id)) + '">' + VS.esc(t.name) + '</option>';
      });
      sel.innerHTML = html;
    }).catch(function () {});
  }

  function loadProjectSelect() {
    VS.api('/admin/veroscholar/api/v1/projects').then(function (r) {
      if (r && r.success) {
        var sel = document.getElementById('d-project');
        var html = '<option value="">' + VS.t('add_to_project') + '...</option>';
        r.data.forEach(function (p) {
          html += '<option value="' + VS.esc(p.id) + '">' + VS.esc(p.name) + '</option>';
        });
        sel.innerHTML = html;
      }
    }).catch(function () {});
  }

  function loadFulltext(id) {
    if (!id) { return; }
    VS.api('/admin/veroscholar/api/v1/papers/' + encodeURIComponent(id) + '/fulltext').then(function (r) {
      if (!r || !r.success) {
        document.getElementById('d-ft-files').innerHTML = '<div class="vs-empty">' + VS.t('failed') + '</div>';
        return;
      }
      renderFulltext(r.data);
    }).catch(function () {});
  }

  function renderFulltext(data) {
    var files = data.files || [];
    var filesBox = document.getElementById('d-ft-files');
    if (!files.length) {
      filesBox.innerHTML = '<div class="vs-empty">' + VS.t('No full text uploaded') + '</div>';
    } else {
      filesBox.innerHTML = files.map(function (f) {
        return '<div class="vs-note">' +
          '<div class="vs-note-head"><span class="vs-note-type">' + VS.esc(f.filename || '—') + '</span>' +
          '<a href="#" data-fid="' + VS.esc(String(f.id)) + '" class="vs-chip-x" title="' + VS.t('Delete full text') + '">&times;</a></div>' +
          '<div class="vs-note-body">' + VS.esc(String(f.n_chunks || 0)) + ' ' + VS.t('chunks') + '</div></div>';
      }).join('');
      filesBox.querySelectorAll('[data-fid]').forEach(function (el) {
        el.addEventListener('click', function (e) {
          e.preventDefault();
          deleteFulltext(el.getAttribute('data-fid'));
        });
      });
    }
    var chunks = data.chunks || [];
    var chunksBox = document.getElementById('d-ft-chunks');
    if (!chunks.length) {
      chunksBox.innerHTML = '<div class="vs-empty">' + VS.t('No chunks yet') + '</div>';
    } else {
      chunksBox.innerHTML = chunks.map(function (c) {
        return '<div class="vs-note">' +
          '<div class="vs-note-head"><span class="vs-note-type">' + VS.t('Chunk') + ' ' + VS.esc(c.page || '') + '</span></div>' +
          '<div class="vs-note-body">' + VS.esc(String(c.content || '').slice(0, 160)) + '</div></div>';
      }).join('');
    }
  }

  function uploadFulltext() {
    if (!currentPaperId) { return; }
    var input = document.getElementById('d-ft-file');
    var file = input.files && input.files[0];
    if (!file) { VS.toast(VS.t('Choose a PDF first'), 'error'); return; }
    var fd = new FormData();
    fd.append('file', file);
    // 上传不能走 VS.api()（会强制 Content-Type: application/json，破坏 multipart boundary）
    fetch('/admin/veroscholar/api/v1/papers/' + encodeURIComponent(currentPaperId) + '/fulltext', {
      method: 'POST',
      headers: VS.authHeaders(),
      body: fd
    }).then(function (r) { return r.json(); }).then(function (r) {
      if (r && r.success) {
        VS.toast(VS.t('Full text uploaded'), 'success');
        input.value = '';
        loadFulltext(currentPaperId);
      } else { VS.toast(r && r.error || VS.t('failed'), 'error'); }
    }).catch(function () { VS.toast(VS.t('network_error'), 'error'); });
  }

  function deleteFulltext(fileId) {
    if (!currentPaperId) { return; }
    VS.api('/admin/veroscholar/api/v1/papers/' + encodeURIComponent(currentPaperId) + '/fulltext/' + encodeURIComponent(fileId), {
      method: 'DELETE'
    }).then(function (r) {
      if (r && r.success) {
        VS.toast(VS.t('Full text deleted'), 'success');
        loadFulltext(currentPaperId);
      } else { VS.toast(r && r.error || VS.t('failed'), 'error'); }
    }).catch(function () { VS.toast(VS.t('network_error'), 'error'); });
  }

  function openDetail(id) {
    currentPaperId = id;
    VS.api('/admin/veroscholar/api/v1/papers/' + encodeURIComponent(id)).then(function (r) {
      if (!r || !r.success) { VS.toast(VS.t('failed'), 'error'); return; }
      var p = r.data;
      document.getElementById('d-title').textContent = p.title;
      document.getElementById('d-meta').textContent = VS.fmtAuthors(p.authors) + '  ·  ' + (p.year || '—') + '  ·  ' + (p.venue || '—');
      document.getElementById('d-abstract').textContent = p.abstract || '—';
      var pdf = document.getElementById('d-pdf');
      if (p.pdf_url) { pdf.href = p.pdf_url; pdf.style.display = ''; }
      else { pdf.style.display = 'none'; }
      renderNotes(r.annotations || []);
      document.getElementById('d-ai-q').value = '';
      document.getElementById('d-ai-result').style.display = 'none';
      document.getElementById('d-status').value = p.reading_status || 'unread';
      loadRelated();
      loadPaperTags();
      document.getElementById('drawer').classList.add('open');
    }).catch(function () { VS.toast(VS.t('network_error'), 'error'); });
  }

  function setStatus() {
    if (!currentPaperId) { return; }
    var status = document.getElementById('d-status').value;
    VS.api('/admin/veroscholar/api/v1/papers/' + encodeURIComponent(currentPaperId) + '/status', {
      method: 'PATCH', body: JSON.stringify({ status: status })
    }).then(function (r) {
      VS.toast(r && r.success ? VS.t('status_saved') : (r && r.error || VS.t('failed')), r && r.success ? 'success' : 'error');
    }).catch(function () { VS.toast(VS.t('network_error'), 'error'); });
  }

  function loadPaperTags() {
    if (!currentPaperId) { return; }
    VS.api('/admin/veroscholar/api/v1/papers/' + encodeURIComponent(currentPaperId) + '/tags').then(function (r) {
      renderTags(r && r.success ? r.data : []);
    }).catch(function () { renderTags([]); });
  }

  function renderTags(tags) {
    var box = document.getElementById('d-tags');
    if (!tags.length) { box.innerHTML = '<div class="vs-empty">' + VS.t('no_tags') + '</div>'; return; }
    box.innerHTML = tags.map(function (t) {
      return '<span class="vs-chip">' + VS.esc(t.name) +
        ' <a href="#" data-rid="' + VS.esc(String(t.id)) + '" class="vs-chip-x" title="remove">&times;</a></span>';
    }).join(' ');
    box.querySelectorAll('[data-rid]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.preventDefault();
        removeTag(el.getAttribute('data-rid'));
      });
    });
  }

  function addTag() {
    if (!currentPaperId) { return; }
    var name = document.getElementById('d-tag-input').value.trim();
    if (!name) { VS.toast(VS.t('tag_empty'), 'error'); return; }
    VS.api('/admin/veroscholar/api/v1/papers/' + encodeURIComponent(currentPaperId) + '/tags', {
      method: 'POST', body: JSON.stringify({ name: name })
    }).then(function (r) {
      if (r && r.success) {
        document.getElementById('d-tag-input').value = '';
        renderTags(r.data);
      } else { VS.toast(r && r.error || VS.t('failed'), 'error'); }
    }).catch(function () { VS.toast(VS.t('network_error'), 'error'); });
  }

  function removeTag(tagId) {
    if (!currentPaperId) { return; }
    VS.api('/admin/veroscholar/api/v1/papers/' + encodeURIComponent(currentPaperId) + '/tags/' + encodeURIComponent(tagId), {
      method: 'DELETE'
    }).then(function (r) {
      if (r && r.success) { renderTags(r.data); }
      else { VS.toast(r && r.error || VS.t('failed'), 'error'); }
    }).catch(function () { VS.toast(VS.t('network_error'), 'error'); });
  }

  function renderNotes(notes) {
    var box = document.getElementById('d-notes');
    if (!notes.length) { box.innerHTML = '<div class="vs-empty">' + VS.t('no_notes') + '</div>'; return; }
    var html = notes.map(function (n) {
      return '<div class="vs-note">' +
        '<div class="vs-note-head"><span class="vs-note-type">' + VS.esc(VS.t(n.note_type || 'summary')) + '</span>' +
        '<span>' + VS.esc(String(n.created_at || '').slice(0, 16)) + '</span></div>' +
        '<div class="vs-note-body">' + VS.esc(n.content) + '</div></div>';
    }).join('');
    box.innerHTML = html;
  }

  function addNote() {
    if (!currentPaperId) { return; }
    var content = document.getElementById('d-note-content').value.trim();
    if (!content) { VS.toast(VS.t('note_empty'), 'error'); return; }
    var type = document.getElementById('d-note-type').value;
    VS.api('/admin/veroscholar/api/v1/papers/' + encodeURIComponent(currentPaperId) + '/annotations', {
      method: 'POST', body: JSON.stringify({ content: content, note_type: type })
    }).then(function (r) {
      if (r.success) {
        document.getElementById('d-note-content').value = '';
        VS.toast(VS.t('note_saved'), 'success');
        openDetail(currentPaperId);
      } else { VS.toast(r.error || VS.t('failed'), 'error'); }
    }).catch(function () { VS.toast(VS.t('network_error'), 'error'); });
  }

  function addToProject() {
    var pid = document.getElementById('d-project').value;
    if (!pid || !currentPaperId) { return; }
    VS.api('/admin/veroscholar/api/v1/projects/' + encodeURIComponent(pid) + '/papers', {
      method: 'POST', body: JSON.stringify({ paper_id: currentPaperId })
    }).then(function (r) {
      VS.toast(r.success ? VS.t('added_to_project') : (r.error || VS.t('failed')), r.success ? 'success' : 'error');
    }).catch(function () { VS.toast(VS.t('network_error'), 'error'); });
  }

  function exportPaper(format) {
    if (!currentPaperId) { VS.toast(VS.t('failed'), 'error'); return; }
    var name = 'paper-' + currentPaperId + '.' + format;
    VS.download('/admin/veroscholar/api/v1/papers/' + encodeURIComponent(currentPaperId) +
      '/export?format=' + encodeURIComponent(format), name);
  }

  function aiResult(msg, isError) {
    var box = document.getElementById('d-ai-result');
    box.style.display = '';
    box.textContent = msg;
    box.style.color = isError ? '#c0392b' : 'inherit';
  }

  function askQuestion() {
    var q = document.getElementById('d-ai-q').value.trim();
    if (!q) { VS.toast(VS.t('ai_empty'), 'error'); return; }
    aiResult(VS.t('ai_thinking'));
    VS.api('/admin/veroscholar/api/v1/papers/' + encodeURIComponent(currentPaperId) + '/chat', {
      method: 'POST', body: JSON.stringify({ question: q })
    }).then(function (r) {
      if (r && r.success) { aiResult(r.data.answer); }
      else { aiResult(r && r.error ? r.error : VS.t('ai_unavailable'), true); }
    }).catch(function () { aiResult(VS.t('ai_unavailable'), true); });
  }

  function translateAbstract() {
    if (!currentPaperId) { return; }
    aiResult(VS.t('ai_thinking'));
    VS.api('/admin/veroscholar/api/v1/papers/' + encodeURIComponent(currentPaperId) + '/translate', {
      method: 'POST', body: JSON.stringify({ target_lang: 'zh' })
    }).then(function (r) {
      if (r && r.success) { aiResult(r.data.translation); }
      else { aiResult(r && r.error ? r.error : VS.t('ai_unavailable'), true); }
    }).catch(function () { aiResult(VS.t('ai_unavailable'), true); });
  }

  function loadRelated() {
    var box = document.getElementById('d-related');
    if (!currentPaperId) { box.innerHTML = ''; return; }
    VS.api('/admin/veroscholar/api/v1/papers/' + encodeURIComponent(currentPaperId) + '/related?limit=5').then(function (r) {
      if (!r || !r.success || !r.data.length) {
        box.innerHTML = '<div class="vs-empty">' + VS.t('no_related') + '</div>';
        return;
      }
      box.innerHTML = '<h4 style="margin:8px 0 4px;">' + VS.t('related_papers') + '</h4>' +
        r.data.map(function (p) {
          return '<div class="vs-paper"><div class="vs-paper-title" style="cursor:pointer;" data-rid="' +
            VS.esc(p.id) + '">' + VS.esc(p.title) + '</div>' +
            '<div class="vs-paper-abs">' + VS.esc(p.venue || '') + ' · ' + VS.esc(String(p.year || '')) +
            (p.similarity ? ' · ' + Math.round(p.similarity * 100) + '%' : '') + '</div></div>';
        }).join('');
      box.querySelectorAll('[data-rid]').forEach(function (el) {
        el.addEventListener('click', function () { openDetail(el.getAttribute('data-rid')); });
      });
    }).catch(function () { box.innerHTML = ''; });
  }

  function init() {
    loadProjectSelect();
    loadTagFilter();
    loadLibrary();
    document.getElementById('btn-search').addEventListener('click', doSearch);
    document.getElementById('q').addEventListener('keydown', function (e) { if (e.key === 'Enter') { doSearch(); } });
    document.getElementById('lib-refresh').addEventListener('click', loadLibrary);
    document.getElementById('lib-q').addEventListener('keydown', function (e) { if (e.key === 'Enter') { loadLibrary(); } });
    document.getElementById('lib-source').addEventListener('change', loadLibrary);
    document.getElementById('lib-tag').addEventListener('change', loadLibrary);
    document.getElementById('lib-status').addEventListener('change', loadLibrary);
    document.getElementById('drawer-close').addEventListener('click', function () { document.getElementById('drawer').classList.remove('open'); });
    document.getElementById('d-annotate').addEventListener('click', addNote);
    document.getElementById('d-project').addEventListener('change', addToProject);
    document.getElementById('d-status').addEventListener('change', setStatus);
    document.getElementById('d-tag-add').addEventListener('click', addTag);
    document.getElementById('d-tag-input').addEventListener('keydown', function (e) { if (e.key === 'Enter') { addTag(); } });
    document.querySelectorAll('[data-export]').forEach(function (btn) {
      btn.addEventListener('click', function () { exportPaper(btn.getAttribute('data-export')); });
    });
    document.getElementById('d-ai-ask').addEventListener('click', askQuestion);
    document.getElementById('d-ai-q').addEventListener('keydown', function (e) { if (e.key === 'Enter') { askQuestion(); } });
    document.getElementById('d-ai-translate').addEventListener('click', translateAbstract);
    document.getElementById('d-ft-upload').addEventListener('click', uploadFulltext);

    // 从仪表盘/详情跳转
    var pm = new URLSearchParams(location.search);
    if (pm.get('paper')) { openDetail(pm.get('paper')); }
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
